name: Build DrumPads iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Simulator & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen generate

      - name: Build for iOS Simulator (Appetize.io)
        run: |
          xcodebuild build \
            -project DrumPadsApp.xcodeproj \
            -scheme DrumPadsApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO
          cd build_sim/Build/Products/Release-iphonesimulator
          zip -r -9 DrumPadsApp-Simulator.zip DrumPadsApp.app
          mv DrumPadsApp-Simulator.zip "$GITHUB_WORKSPACE/"

      - name: Build for iPhone Device (Sideloadly)
        run: |
          xcodebuild build \
            -project DrumPadsApp.xcodeproj \
            -scheme DrumPadsApp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build_device/Build/Products/Release-iphoneos/DrumPadsApp.app Payload/
          codesign --force --deep --sign - Payload/DrumPadsApp.app || true
          zip -r -9 DrumPadsApp.ipa Payload

      - name: Upload Simulator Build (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: DrumPadsApp-Simulator
          path: DrumPadsApp-Simulator.zip
          retention-days: 14

      - name: Upload Device IPA (Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: DrumPadsApp-IPA
          path: DrumPadsApp.ipa
          retention-days: 14
