name: Build iOS IPA (DrumPads 24)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package DrumPads IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Setup Project Directory & Generate Xcode Project
        run: |
          if [ -d "drumpads-ios" ]; then
            cd drumpads-ios
          fi
          xcodegen generate
          ls -la

      - name: Build iOS Application (Release)
        run: |
          if [ -d "drumpads-ios" ]; then
            cd drumpads-ios
          fi
          xcodebuild build \
            -project DrumPadsApp.xcodeproj \
            -scheme DrumPadsApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          if [ -d "drumpads-ios" ]; then
            cd drumpads-ios
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DrumPadsApp.app Payload/
          # Ad-hoc sign so iOS and Sideloadly recognize bundle entitlements
          codesign --force --deep --sign - Payload/DrumPadsApp.app
          zip -r -9 DrumPadsApp.ipa Payload
          ls -lh DrumPadsApp.ipa

      - name: Upload DrumPadsApp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumPadsApp-ipa
          path: "**/DrumPadsApp.ipa"
          retention-days: 14

