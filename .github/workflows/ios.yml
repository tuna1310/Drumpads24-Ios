name: Build DrumPads IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package DrumPads IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project DrumPadsApp.xcodeproj \
            -scheme DrumPadsApp \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -R build_device/Build/Products/Release-iphoneos/DrumPadsApp.app Payload/
          codesign --force --deep --sign - Payload/DrumPadsApp.app || true
          zip -r -9 DrumPadsApp.ipa Payload

      - name: Upload DrumPadsApp-IPA
        uses: actions/upload-artifact@v4
        with:
          name: DrumPadsApp-IPA
          path: DrumPadsApp.ipa
          retention-days: 14
