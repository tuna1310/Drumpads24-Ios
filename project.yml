name: DrumPadsApp
options:
  bundleIdPrefix: com.drumpads
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DrumPadsApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DrumPadsApp
        excludes:
          - "**/*.md"
          - "Resources/**"
      - path: Sources/DrumPadsApp/Resources/starter
        buildPhase: resources
        type: folder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.drumpads.ios
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
  DrumPadsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/DrumPadsTests
    dependencies:
      - target: DrumPadsApp

